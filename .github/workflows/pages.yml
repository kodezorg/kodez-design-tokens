name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/showcase.html'
      - 'src/tokens.ts'          # token value changes reflected in showcase CSS vars
      - 'component-contract.yaml' # contract changes may trigger showcase AI sync first
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pages artifact
        run: |
          mkdir -p _site
          cp examples/showcase.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
