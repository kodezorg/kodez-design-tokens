name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Validate & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate
        run: npm run validate

      - name: Configure Azure Artifacts auth
        run: |
          B64=$(echo -n "${NPM_TOKEN}" | base64)
          FEED="//pkgs.dev.azure.com/kodez/kodez-connect/_packaging/kodez-connect-packages/npm/registry/"
          echo "${FEED}:username=github-actions" >> ~/.npmrc
          echo "${FEED}:_password=${B64}"        >> ~/.npmrc
          echo "${FEED}:email=ci@kodez.com.au"   >> ~/.npmrc
          echo "always-auth=true"                >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to Azure Artifacts
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
